<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C44900" />
      <stop offset="100%" stop-color="#E86711" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Glow Effects -->
  <circle cx="1050" cy="150" r="280" fill="#C44900" opacity="0.15" filter="blur(60px)" />
  <circle cx="150" cy="500" r="220" fill="#E86711" opacity="0.1" filter="blur(50px)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(80, 85)">
    <rect width="360" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="20" r="5" fill="#C44900" />
    <text x="35" y="25" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CURATED DEVELOPER ARSENAL</text>
  </g>

  <!-- Headline: WEB TOOLS -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="92" font-weight="900" letter-spacing="-2">WEB</text>
    <text x="240" y="0" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="92" font-weight="900" letter-spacing="-2">TOOLS</text>
  </g>

  <!-- Subtitle Narrative -->
  <g transform="translate(80, 295)">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
      Research-Backed Directory for Software Engineers &amp; CS Students
    </text>
    <text x="0" y="38" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      IDEs &bull; AI Agents &bull; LLMs &bull; Free Certifications &bull; UI Inspo &bull; Student Perks &bull; Design Assets
    </text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="64" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" fill="#64748B" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">CURATED TOOLS</text>
    <text x="24" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">125+ Verified</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="180" height="64" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="224" y="26" fill="#64748B" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">CATEGORIES</text>
    <text x="224" y="50" fill="#E86711" font-family="system-ui, sans-serif" font-size="22" font-weight="800">7 Domains</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="180" height="64" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="424" y="26" fill="#64748B" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">PRICING</text>
    <text x="424" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">100% Free Tiers</text>
  </g>

  <!-- Right Visual Element: Branded Geometric Frame -->
  <g transform="translate(800, 160)" filter="url(#cardShadow)">
    <rect width="280" height="280" rx="36" fill="#111827" stroke="#1E293B" stroke-width="3" />
    <!-- Monogram inside card -->
    <path d="M 60 90 L 100 200 L 140 120 L 180 200 L 220 90" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="140" cy="70" r="8" fill="#E86711" />
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" fill="#64748B" font-family="monospace" font-size="14" font-weight="600">
      kidlatpogi / web-tools &bull; Built with Astro &amp; React
    </text>
  </g>
</svg>
