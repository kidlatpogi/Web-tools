<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C44900" />
      <stop offset="100%" stop-color="#E86711" />
    </linearGradient>
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#C44900" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="2" />

  <!-- WT Monogram Typography -->
  <!-- "W" -->
  <path d="M 12 18 L 19 46 L 27 26 L 35 46 L 42 18" 
        fill="none" 
        stroke="url(#wtGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#tabGlow)" />

  <!-- "T" -->
  <path d="M 44 20 L 56 20 M 50 20 L 50 46" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Orange dot accent -->
  <circle cx="50" cy="14" r="2.5" fill="#E86711" />
</svg>
