<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C44900" />
      <stop offset="100%" stop-color="#E86711" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C44900" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Grid Accent Lines -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4" />
  <line x1="32" y1="2" x2="32" y2="62" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4" />

  <!-- Code Monogram "W" Vector -->
  <path d="M 14 20 L 22 44 L 32 26 L 42 44 L 50 20" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Precision Target Crosshair Dots -->
  <circle cx="32" cy="15" r="2" fill="#E86711" />
</svg>
